<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marvel Champions - Selección</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f0f12; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .box { background: #18181c; padding: 30px; border-radius: 16px; border: 1px solid #2a2a35; text-align: center; max-width: 380px; width: 100%; }
    h1 { color: #fbc02d; font-size: 1.4rem; margin-bottom: 20px; }
    label { display: block; text-align: left; font-size: 0.8rem; color: #888; margin-top: 10px; text-transform: uppercase; }
    input { width: 100%; padding: 12px; margin: 6px 0 16px; background: #222; border: 1px solid #333; color: #fff; text-align: center; font-size: 1.2rem; border-radius: 8px; text-transform: uppercase; font-weight: bold; }
    .btn { display: block; width: 100%; padding: 14px; margin-bottom: 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; text-decoration: none; color: white; }
    .btn-villain { background: #d32f2f; }
    .btn-hero { background: #1976d2; }
  </style>
</head>
<body>
  <div class="box">
    <h1>MARVEL CHAMPIONS</h1>
    <label>Código de Sala</label>
    <input type="text" id="room" value="MARV" maxlength="8">
    
    <button class="btn btn-villain" onclick="irA('villano.html')">👹 Entrar como Villano / Plan</button>
    <button class="btn btn-hero" onclick="irA('heroe.html')">🦸‍♂️ Entrar como Héroe</button>
  </div>

  <script>
    function irA(pagina) {
      const room = document.getElementById('room').value.trim().toUpperCase() || 'MARV';
      window.location.href = `${pagina}?room=${room}`;
    }
  </script>
</body>
</html>
