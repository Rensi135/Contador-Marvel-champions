<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Panel de Héroes</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; user-select: none; }
    body { background: #0f0f12; color: #fff; min-height: 100vh; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
    
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a32; padding-bottom: 8px; }
    header h1 { font-size: 1rem; color: #2563eb; }
    .badge { background: #1d4ed8; padding: 4px 8px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; }

    .section-title { font-size: 0.8rem; color: #8e8e93; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
    .btn-add { background: #282834; border: 1px solid #444; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
    .btn-add:active { background: #44445c; }

    /* GRID DE HÉROES */
    .heroes-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
      gap: 12px; 
      width: 100%; 
    }
    
    .card-hero {
      background: #18181c;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #2a2a35;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: border-color 0.2s;
    }

    .hero-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: transparent;
      border: none;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
      text-align: center;
      outline: none;
      width: 100%;
      margin-bottom: 6px;
      padding-bottom: 4px;
      user-select: text;
    }

    .hp-display {
      font-size: 3rem;
      font-weight: 900;
      margin: 4px 0;
    }

    /* GRID EN 2 COLUMNAS PARA LOS BOTONES DE HÉROE */
    .btn-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
    }

    .btn-hero {
      padding: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    
    /* Botones de restar y sumar */
    .btn-minus { background: #321c1c; color: #f87171; border: 1px solid #7f1d1d; }
    .btn-minus:active { background: #7f1d1d; color: #fff; }

    .btn-plus { background: #1c2d27; color: #4ade80; border: 1px solid #14532d; }
    .btn-plus:active { background: #14532d; color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>PANEL DE HÉROES</h1>
    <div class="badge" id="room-badge">SALA: -</div>
  </header>

  <div class="section-title">
    <span>Héroes en Partida</span>
    <div>
      <button class="btn-add" onclick="adjustHeroCount(-1)">- Héroe</button>
      <button class="btn-add" onclick="adjustHeroCount(1)">+ Héroe</button>
    </div>
  </div>

  <div class="heroes-grid" id="heroes"></div>

  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('room') || 'MARV';
    document.getElementById('room-badge').innerText = `SALA: ${roomCode}`;

    socket.emit('join_room', { roomCode });

    let currentHeroesCount = 0;

    socket.on('update_room', (data) => {
      const container = document.getElementById('heroes');
      container.innerHTML = '';
      
      const heroes = data.heroes || [];
      currentHeroesCount = heroes.length;

      heroes.forEach((h, idx) => {
        const card = document.createElement('div');
        card.className = 'card-hero';
        
        // Color personalizado de borde según el héroe
        const heroColor = h.color || '#2563eb';
        card.style.borderTop = `5px solid ${heroColor}`;

        card.innerHTML = `
          <input class="hero-title" value="${h.name}" onchange="updateHeroName(${idx}, this.value)" placeholder="Nombre Héroe">
          <div class="hp-display" style="color: ${heroColor}">${h.hp}</div>
          
          <!-- BOTONES EN 2 COLUMNAS: -1/+1, -3/+3, -5/+5 -->
          <div class="btn-grid-2col">
            <button class="btn-hero btn-minus" onclick="changeHeroHP(${idx}, -1)">-1</button>
            <button class="btn-hero btn-plus" onclick="changeHeroHP(${idx}, 1)">+1</button>
            
            <button class="btn-hero btn-minus" onclick="changeHeroHP(${idx}, -3)">-3</button>
            <button class="btn-hero btn-plus" onclick="changeHeroHP(${idx}, 3)">+3</button>
            
            <button class="btn-hero btn-minus" onclick="changeHeroHP(${idx}, -5)">-5</button>
            <button class="btn-hero btn-plus" onclick="changeHeroHP(${idx}, 5)">+5</button>
          </div>
        `;
        container.appendChild(card);
      });
    });

    // FUNCIONES DE CONTROL DE HÉROES
    function adjustHeroCount(delta) {
      if (delta > 0) socket.emit('update_hero', { action: 'add' });
      else if (currentHeroesCount > 0) socket.emit('update_hero', { action: 'remove', index: currentHeroesCount - 1 });
    }
    
    function changeHeroHP(index, delta) { 
      socket.emit('update_hero', { action: 'change_hp', index, delta }); 
    }
    
    function updateHeroName(index, name) { 
      socket.emit('update_hero', { action: 'change_name', index, name }); 
    }
  </script>

</body>
</html>
