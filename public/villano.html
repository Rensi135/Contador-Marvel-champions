<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Panel Villano</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; user-select: none; }
    body { background: #0f0f12; color: #fff; min-height: 100vh; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a32; padding-bottom: 8px; }
    header h1 { font-size: 1rem; color: #fbc02d; text-transform: uppercase; }
    .badge { background: #f57c00; padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; color: #fff; }
    
    /* SELECTOR DE JUGADORES */
    .players-selector { background: #18181c; padding: 10px 14px; border-radius: 12px; border: 1px solid #2a2a35; display: flex; align-items: center; justify-content: space-between; }
    .players-selector span { font-size: 0.85rem; color: #aaa; font-weight: bold; text-transform: uppercase; }
    .players-counter { display: flex; align-items: center; gap: 8px; }
    .btn-qty { width: 36px; height: 36px; background: #282834; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-qty:active { background: #44445c; }
    
    .input-players { 
      width: 60px; height: 36px; background: #000; border: 1px solid #fbc02d; color: #fbc02d; 
      text-align: center; font-size: 1.2rem; font-weight: bold; border-radius: 8px; outline: none; 
      -moz-appearance: textfield; user-select: text;
    }
    .input-players::-webkit-outer-spin-button, .input-players::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* TARJETAS */
    .card { background: #18181c; border-radius: 12px; padding: 14px; border: 1px solid #2a2a35; display: flex; flex-direction: column; align-items: center; position: relative; margin-bottom: 10px; }
    .card.threat { border-top: 4px solid #f57c00; background: linear-gradient(180deg, #2b1800 0%, #18181c 100%); }
    .card.villain { border-top: 4px solid #d32f2f; background: linear-gradient(180deg, #2a1112 0%, #18181c 100%); }

    .input-name { font-size: 1.1rem; font-weight: bold; color: #fff; background: rgba(0, 0, 0, 0.2); border: 1px solid #333; border-radius: 6px; text-align: center; padding: 6px 10px; width: 95%; outline: none; margin-bottom: 6px; user-select: text; }
    .input-name:focus { border-color: #fbc02d; background: #000; }

    .hp-display { font-size: 3rem; font-weight: 900; margin: 2px 0; }
    .threat .hp-display { color: #ffb74d; }
    .villain .hp-display { color: #ff5252; }

    /* CONTROLES BASE (AMENAZA Y UMBRAL) */
    .base-controls-row { display: flex; justify-content: space-around; width: 100%; margin: 8px 0; gap: 8px; }
    .base-control-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.75rem; color: #aaa; font-weight: bold; }
    
    .input-base-hp { width: 60px; height: 32px; background: #000; text-align: center; font-size: 1.1rem; font-weight: bold; border-radius: 6px; outline: none; -moz-appearance: textfield; user-select: text; }
    .threat .input-base-hp { border: 1px solid #f57c00; color: #ffb74d; }
    .villain .input-base-hp { border: 1px solid #d32f2f; color: #ff5252; }
    .input-base-hp::-webkit-outer-spin-button, .input-base-hp::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* BOTONERA (+1, -1, +5, etc) */
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 6px; }
    .btn-grid button { padding: 10px 0; font-size: 1.1rem; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: #fff; }
    .btn-minus { background: #3e1b1b; border: 1px solid #6b2828 !important; color: #ff8a8a !important; }
    .btn-plus { background: #1b3e2b; border: 1px solid #286b43 !important; color: #8affb3 !important; }
    .btn-minus:active { background: #5a2727; }
    .btn-plus:active { background: #275a3a; }
    
    .section-title { font-size: 0.8rem; color: #8e8e93; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; margin-top: 6px; margin-bottom: 6px; }
    .btn-actions { display: flex; gap: 6px; }
    .btn-action { background: #282834; border: 1px solid #444; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .schemes-list, .villains-list { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .btn-del { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer; width: auto; padding: 0; }

    /* MODAL SELECCIÓN INICIAL Y BUSCADOR PERSONALIZADO */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 16px; }
    .modal-card { background: #18181c; padding: 24px; border-radius: 12px; border: 2px solid #fbc02d; text-align: center; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 16px; position: relative; }
    .modal-card h2 { color: #fbc02d; font-size: 1.2rem; text-transform: uppercase; }
    .modal-card p { color: #aaa; font-size: 0.85rem; line-height: 1.3; }
    
    .search-container { position: relative; width: 100%; }
    .modal-select { width: 100%; padding: 12px; background: #000; color: #fff; border: 1px solid #fbc02d; border-radius: 8px; font-size: 0.95rem; outline: none; text-align: left; }
    
    .dropdown-results { position: absolute; top: 100%; left: 0; right: 0; max-height: 180px; overflow-y: auto; background: #000; border: 1px solid #fbc02d; border-top: none; border-radius: 0 0 8px 8px; z-index: 1000; display: none; text-align: left; }
    .dropdown-item { padding: 10px 12px; font-size: 0.9rem; color: #fff; cursor: pointer; border-bottom: 1px solid #222; }
    .dropdown-item:hover { background: #282834; color: #fbc02d; }

    .btn-confirm { width: 100%; padding: 12px; background: #fbc02d; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; text-transform: uppercase; }
    .btn-confirm:active { background: #f57c00; color: #fff; }
  </style>
</head>
<body>

  <!-- MODAL SELECCIÓN DE VILLANO -->
  <div class="modal-overlay" id="villain-modal">
    <div class="modal-card">
      <h2>Seleccionar Escenario</h2>
      <p>Busca y selecciona el villano de la base de datos para cargar automáticamente los datos.</p>
      
      <div class="search-container">
        <input type="text" class="modal-select" id="modal-villain-search" placeholder="🔍 Escribe para buscar villano o set..." autocomplete="off" oninput="filterVillains(this.value)">
        <div class="dropdown-results" id="villains-dropdown"></div>
      </div>

      <button class="btn-confirm" onclick="confirmVillainSelection()">Cargar Escenario</button>
    </div>
  </div>

  <header>
    <h1>PANEL DE VILLANO</h1>
    <div class="badge" id="room-badge">SALA: -</div>
  </header>

  <!-- CONTROL DE JUGADORES -->
  <div class="players-selector">
    <span>Jugadores Totales:</span>
    <div class="players-counter">
      <button class="btn-qty" onclick="adjustPlayers(-1)">-</button>
      <input type="number" class="input-players" id="players-count" value="1" min="1" onkeydown="if(event.key==='Enter') this.blur()" onchange="setPlayers(this.value)">
      <button class="btn-qty" onclick="adjustPlayers(1)">+</button>
    </div>
  </div>

  <!-- PLANES PRINCIPALES -->
  <div class="section-title">
    <span>Planes Principales</span>
    <div class="btn-actions">
      <button class="btn-action" onclick="removeScheme()">- Plan</button>
      <button class="btn-action" onclick="addScheme()">+ Plan</button>
    </div>
  </div>
  <div class="schemes-list" id="schemes"></div>

  <!-- VILLANOS Y ESBIRROS -->
  <div class="section-title">
    <span>Villanos y Esbirros</span>
    <div class="btn-actions">
      <button class="btn-action" onclick="removeVillain()">- Villano</button>
      <button class="btn-action" onclick="addVillain()">+ Villano</button>
    </div>
  </div>
  <div class="villains-list" id="villains"></div>

  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('room') || 'MARV';
    document.getElementById('room-badge').innerText = `SALA: ${roomCode}`;

    let isHost = false;
    let globalDatabase = [];
    let selectedPresetKey = '';

    socket.emit('join_room', { roomCode });

    function populateVillainSelect(database) {
      globalDatabase = database || [];
      filterVillains('');
    }

    function filterVillains(query) {
      const dropdown = document.getElementById('villains-dropdown');
      if (!dropdown) return;

      dropdown.innerHTML = '';
      const text = query.toLowerCase().trim().replace(/_/g, ' ');

      const filtered = globalDatabase.filter(v => {
        const villano = (v.villainName || '').toLowerCase().replace(/_/g, ' ');
        const plan = (v.mainSchemes && v.mainSchemes[0] && v.mainSchemes[0].name ? v.mainSchemes[0].name : '').toLowerCase().replace(/_/g, ' ');
        const key = (v.key || '').toLowerCase().replace(/_/g, ' ');
        
        return villano.includes(text) || plan.includes(text) || key.includes(text);
      });

      if (filtered.length === 0) {
        dropdown.style.display = 'none';
        return;
      }

      filtered.forEach(v => {
        const item = document.createElement('div');
        item.className = 'dropdown-item';
        const villano = v.villainName || 'Villano';
        const plan = v.mainSchemes && v.mainSchemes[0] && v.mainSchemes[0].name ? ` — ${v.mainSchemes[0].name}` : '';
        item.textContent = `${villano}${plan} [set: ${v.key}]`;
        
        item.onclick = () => {
          document.getElementById('modal-villain-search').value = `${villano}${plan}`;
          selectedPresetKey = v.key; 
          dropdown.style.display = 'none';
        };

        dropdown.appendChild(item);
      });

      dropdown.style.display = 'block';
    }

    document.addEventListener('click', (e) => {
      const container = document.querySelector('.search-container');
      const dropdown = document.getElementById('villains-dropdown');
      if (container && !container.contains(e.target)) {
        if (dropdown) dropdown.style.display = 'none';
      }
    });

    socket.on('init_session', (data) => {
      isHost = data.isHost;
      if (data.database) {
        populateVillainSelect
