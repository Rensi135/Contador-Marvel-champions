<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Panel Villano & Plan Principal</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; user-select: none; }
    body { background: #0f0f12; color: #fff; min-height: 100vh; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
    
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a32; padding-bottom: 8px; }
    header h1 { font-size: 1rem; color: #f59e0b; }
    .badge { background: #d97706; padding: 4px 8px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; }

    /* PLAN PRINCIPAL / AMENAZA */
    .threat-container {
      background: #18181c;
      border: 1px solid #2a2a35;
      border-top: 5px solid #f59e0b;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .plan-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: transparent;
      border: none;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
      text-align: center;
      outline: none;
      width: 100%;
      margin-bottom: 6px;
      padding-bottom: 4px;
      user-select: text;
    }

    .threat-display {
      font-size: 3rem;
      font-weight: 900;
      color: #f59e0b;
      margin: 4px 0;
    }
    .threat-display .total {
      font-size: 1.8rem;
      color: #8e8e93;
    }

    /* GRID EN 2 COLUMNAS PARA LOS BOTONES */
    .btn-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
    }

    .btn-threat {
      padding: 10px 0;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
    }
    
    /* Estilos diferenciados para restar y sumar */
    .btn-minus { background: #321c1c; color: #f87171; border: 1px solid #7f1d1d; }
    .btn-minus:active { background: #7f1d1d; color: #fff; }

    .btn-plus { background: #1c2d27; color: #4ade80; border: 1px solid #14532d; }
    .btn-plus:active { background: #14532d; color: #fff; }

    /* FILA DE CONFIGURACIÓN EN 2 COLUMNAS */
    .config-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #2a2a32;
    }

    .config-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      color: #ccc;
    }

    .config-input {
      width: 55px;
      background: #000;
      border: 1px solid #f59e0b;
      color: #f59e0b;
      border-radius: 6px;
      padding: 4px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      outline: none;
    }

    /* SECCIÓN VILLANOS */
    .section-title { font-size: 0.8rem; color: #8e8e93; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
    .btn-add { background: #282834; border: 1px solid #444; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
    .btn-add:active { background: #44445c; }

    .villains-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; width: 100%; }
    
    .card-villain {
      background: #18181c;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #2a2a35;
      border-top: 5px solid #dc2626;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .villain-title {
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: transparent;
      border: none;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
      text-align: center;
      outline: none;
      width: 100%;
      margin-bottom: 6px;
      padding-bottom: 4px;
      user-select: text;
    }

    .hp-display {
      font-size: 3rem;
      font-weight: 900;
      margin: 4px 0;
      color: #dc2626;
    }
  </style>
</head>
<body>

  <header>
    <h1>PANEL DE VILLANO</h1>
    <div class="badge" id="room-badge">SALA: -</div>
  </header>

  <!-- SECCIÓN PLAN PRINCIPAL -->
  <div class="threat-container">
    <input type="text" id="plan-name-input" class="plan-title" placeholder="Plan Principal" onchange="changePlanName(this.value)">
    
    <div class="threat-display">
      <span id="threat-current">0</span><span class="total"> / <span id="threat-target">0</span></span>
    </div>

    <!-- BOTONES EN 2 COLUMNAS (RESTAR IZQUIERDA / SUMAR DERECHA) -->
    <div class="btn-grid-2col">
      <button class="btn-threat btn-minus" onclick="changeThreat(-1)">-1</button>
      <button class="btn-threat btn-plus" onclick="changeThreat(1)">+1</button>
      
      <button class="btn-threat btn-minus" onclick="changeThreat(-5)">-5</button>
      <button class="btn-threat btn-plus" onclick="changeThreat(5)">+5</button>
      
      <button class="btn-threat btn-minus" onclick="changeThreat(-10)">-10</button>
      <button class="btn-threat btn-plus" onclick="changeThreat(10)">+10</button>
    </div>

    <div class="config-row">
      <div class="config-item">
        <span>Amenaza Base / Jugador</span>
        <input type="number" id="base-threat-input" class="config-input" onchange="changeBaseThreat(this.value)">
      </div>
      <div class="config-item">
        <span>Umbral / Jugador</span>
        <input type="number" id="target-threat-input" class="config-input" onchange="changeTargetBaseThreat(this.value)">
      </div>
    </div>
  </div>

  <!-- SECCIÓN VILLANOS -->
  <div class="section-title">
    <span>Villanos y Esbirros</span>
    <div>
      <button class="btn-add" onclick="adjustVillainCount(-1)">- Villano</button>
      <button class="btn-add" onclick="adjustVillainCount(1)">+ Villano</button>
    </div>
  </div>

  <div class="villains-grid" id="villains"></div>

  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('room') || 'MARV';
    document.getElementById('room-badge').innerText = `SALA: ${roomCode}`;

    socket.emit('join_room', { roomCode });

    let currentVillainsCount = 0;

    socket.on('update_room', (data) => {
      // 1. DIBUJAR PLAN PRINCIPAL (AMENAZA)
      const threat = data.threat || {};
      document.getElementById('threat-current').innerText = threat.current || 0;
      document.getElementById('threat-target').innerText = threat.target || 0;

      if (document.activeElement !== document.getElementById('plan-name-input')) {
        document.getElementById('plan-name-input').value = threat.name || 'Plan Principal';
      }
      if (document.activeElement !== document.getElementById('base-threat-input')) {
        document.getElementById('base-threat-input').value = threat.baseThreat || 1;
      }
      if (document.activeElement !== document.getElementById('target-threat-input')) {
        document.getElementById('target-threat-input').value = threat.targetBase || 7;
      }

      // 2. DIBUJAR LISTA DE VILLANOS
      const container = document.getElementById('villains');
      container.innerHTML = '';
      
      const villains = data.villains || [];
      currentVillainsCount = villains.length;

      villains.forEach((v, idx) => {
        const card = document.createElement('div');
        card.className = 'card-villain';

        card.innerHTML = `
          <input class="villain-title" value="${v.name}" onchange="updateVillainName(${idx}, this.value)" placeholder="Nombre Villano">
          <div class="hp-display">${v.hp}</div>
          
          <!-- BOTONES EN 2 COLUMNAS PARA EL VILLANO -->
          <div class="btn-grid-2col">
            <button class="btn-threat btn-minus" onclick="changeVillainHP(${idx}, -1)">-1</button>
            <button class="btn-threat btn-plus" onclick="changeVillainHP(${idx}, 1)">+1</button>
            
            <button class="btn-threat btn-minus" onclick="changeVillainHP(${idx}, -5)">-5</button>
            <button class="btn-threat btn-plus" onclick="changeVillainHP(${idx}, 5)">+5</button>
            
            <button class="btn-threat btn-minus" onclick="changeVillainHP(${idx}, -10)">-10</button>
            <button class="btn-threat btn-plus" onclick="changeVillainHP(${idx}, 10)">+10</button>
          </div>

          <div style="margin-top: 12px; font-size: 0.75rem; color: #aaa; display: flex; align-items: center; gap: 6px;">
            <span>Vida Base / Jugador:</span>
            <input type="number" class="config-input" style="border-color: #dc2626; color: #dc2626;" value="${v.baseHp || 10}" onchange="changeVillainBaseHp(${idx}, this.value)">
          </div>
        `;
        container.appendChild(card);
      });
    });

    // EVENTOS DE PLAN PRINCIPAL
    function changeThreat(delta) { socket.emit('update_threat', { delta }); }
    function changePlanName(name) { socket.emit('update_threat', { name }); }
    function changeBaseThreat(val) { socket.emit('update_threat', { baseThreat: parseInt(val) || 0 }); }
    function changeTargetBaseThreat(val) { socket.emit('update_threat', { targetBase: parseInt(val) || 1 }); }

    // EVENTOS DE VILLANOS
    function adjustVillainCount(delta) {
      if (delta > 0) socket.emit('update_villain', { action: 'add' });
      else if (currentVillainsCount > 1) socket.emit('update_villain', { action: 'remove', index: currentVillainsCount - 1 });
    }
    function changeVillainHP(index, delta) { socket.emit('update_villain', { action: 'change_hp', index, delta }); }
    function updateVillainName(index, name) { socket.emit('update_villain', { action: 'change_name', index, name }); }
    function changeVillainBaseHp(index, baseHp) { socket.emit('update_villain', { action: 'change_base_hp', index, baseHp }); }
  </script>

</body>
</html>
